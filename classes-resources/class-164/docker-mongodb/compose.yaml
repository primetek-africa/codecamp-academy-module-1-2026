services:

  mongodb:
    image: mongo:7.0
    container_name: docker_mongodb_classroom
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/dbcd codecamp-academy-module-1-2026/classes-resources/class-164/docker-mongodb

volumes:
  mongodb_data: